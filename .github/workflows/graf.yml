name: Gerar Gráfico de Linguagens (SVG)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar Linguagens de Todos os Repositórios
        id: languages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allLanguages = {};
            let page = 1;
            let hasMore = true;
            let allRepos = [];

            // Buscar todos os repositórios com tratamento de erros
            while (hasMore) {
              try {
                const { data: repos } = await github.rest.repos.listForAuthenticatedUser({
                  per_page: 100,
                  page: page,
                  sort: 'updated'
                });

                if (repos.length === 0) {
                  hasMore = false;
                  break;
                }

                allRepos.push(...repos);
                page++;
              } catch (error) {
                if (error.status === 403) {
                  console.log('⚠️ Acesso negado ao listar repositórios. Verificando permissões do token.');
                  hasMore = false;
                } else if (error.status === 401) {
                  console.error('❌ Token não autorizado. Verifique as credenciais.');
                  throw new Error('Token não autorizado');
                } else {
                  console.error(`❌ Erro ao listar repositórios: ${error.status} - ${error.message}`);
                  throw error;
                }
              }
            }

            console.log(`✅ Total de repositórios encontrados: ${allRepos.length}`);

            if (allRepos.length === 0) {
              console.log('⚠️ Nenhum repositório encontrado. Encerrando.');
              core.setOutput('languages', JSON.stringify({}));
              process.exit(0);
            }

            const CONCURRENCY_LIMIT = 10;

            for (let i = 0; i < allRepos.length; i += CONCURRENCY_LIMIT) {
              const chunk = allRepos.slice(i, i + CONCURRENCY_LIMIT);

              const promises = chunk.map(async (repo) => {
                try {
                  const { data: languages } = await github.rest.repos.listLanguages({
                    owner: repo.owner.login,
                    repo: repo.name,
                  });

                  return { success: true, repoName: repo.name, languages };
                } catch (error) {
                  if (error.status === 403) {
                    console.log(`⚠️ Ignorando ${repo.name}: sem acesso (403)`);
                  } else if (error.status === 404) {
                    console.log(`⚠️ Ignorando ${repo.name}: repositório vazio ou não encontrado (404)`);
                  } else if (error.status === 401) {
                    console.log(`⚠️ Ignorando ${repo.name}: não autorizado (401)`);
                  } else {
                    console.log(`⚠️ Erro em ${repo.name}: ${error.status || 'Erro desconhecido'} - ${error.message}`);
                  }
                  return { success: false, repoName: repo.name, error };
                }
              });

              try {
                const results = await Promise.all(promises);

                for (const res of results) {
                  if (res.success) {
                    for (const [lang, bytes] of Object.entries(res.languages)) {
                      allLanguages[lang] = (allLanguages[lang] || 0) + bytes;
                    }
                  }
                }
              } catch (error) {
                console.error(`❌ Erro crítico ao processar chunk: ${error.message}`);
                throw error;
              }
            }

            console.log('📊 Total de linguagens encontradas:', Object.keys(allLanguages).length);
            console.log('📈 Linguagens:', allLanguages);
            core.setOutput('languages', JSON.stringify(allLanguages));

      - name: Gerar Gráfico SVG
        run: |
          node << 'EOF'
          const fs = require('fs');
          const languages = JSON.parse('${{ steps.languages.outputs.languages }}');
          
          // Ordenar linguagens por bytes (decrescente)
          const sorted = Object.entries(languages)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10); // Top 10
          
          // Calcular total
          const total = Object.values(languages).reduce((a, b) => a + b, 0);
          
          if (sorted.length === 0) {
            console.log('⚠️ Nenhuma linguagem encontrada');
            process.exit(0);
          }
          
          // Cores para as linguagens
          const colors = [
            '#f7df1e', '#3776ab', '#f34b7d', '#00add8', '#ce422b',
            '#4479a7', '#563d7c', '#92e1c0', '#f1e05a', '#3178c6'
          ];
          
          // Gerar SVG com gráfico de barras
          let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="${50 + sorted.length * 35}" viewBox="0 0 500 ${50 + sorted.length * 35}">
            <defs>
              <style>
                .title { font-size: 24px; font-weight: bold; fill: #0d1117; }
                .label { font-size: 12px; fill: #666; }
                .percent { font-size: 11px; fill: #666; }
                .bar { transition: width 0.3s ease; }
              </style>
            </defs>
            <rect width="500" height="${50 + sorted.length * 35}" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" rx="6"/>
            <text x="20" y="35" class="title">📊 Top Languages</text>
          `;
          
          let yOffset = 65;
          sorted.forEach(([lang, bytes], index) => {
            const percent = ((bytes / total) * 100).toFixed(1);
            const barWidth = Math.max(20, (percent / 100) * 350);
            
            svg += `
              <text x="20" y="${yOffset + 5}" class="label">${lang}</text>
              <rect x="120" y="${yOffset - 8}" width="${barWidth}" height="16" fill="${colors[index]}" rx="2"/>
              <text x="${120 + barWidth + 5}" y="${yOffset + 5}" class="percent">${percent}%</text>
            `;
            yOffset += 35;
          });
          
          svg += `
            <text x="20" y="${yOffset + 15}" class="label">Total: ${(total / 1024 / 1024).toFixed(1)} MB • Updated: ${new Date().toLocaleDateString()}</text>
          </svg>`;
          
          fs.writeFileSync('languages.svg', svg);
          console.log('✅ SVG gerado com sucesso!');
          EOF

      - name: Commit e Push com Retry
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add languages.svg
          
          if git diff --staged --quiet; then
            echo "✅ Sem mudanças para commitar"
            exit 0
          fi
          
          git commit -m "📊 Update language statistics SVG"
          
          # Tentar push com retry automático
          for i in {1..3}; do
            echo "🔄 Tentativa $i de 3..."
            if git pull --rebase origin main && git push origin main; then
              echo "✅ Push realizado com sucesso!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "⏳ Aguardando antes de retentar..."
              sleep 2
            fi
          done
          
          echo "❌ Falha após 3 tentativas"
          exit 1
