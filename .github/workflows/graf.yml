name: Gerar Gráfico de Linguagens

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-graph:
    # ... rest of workflow

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      repositories: read
      actions: read
      
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Buscar Linguagens de Todos os Repositórios
        id: languages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allLanguages = {};
            let page = 1;
            let hasMore = true;
            let allRepos = [];
            
            while (hasMore) {
              const { data: repos } = await github.rest.repos.listForAuthenticatedUser({
                per_page: 100,
                page: page,
                sort: 'updated'
              });
              
              if (repos.length === 0) {
                hasMore = false;
                break;
              }
              
              allRepos.push(...repos);
              page++;
            }
            
            console.log(`Total de repositórios encontrados: ${allRepos.length}`);
            
            const CONCURRENCY_LIMIT = 10;
            
            for (let i = 0; i < allRepos.length; i += CONCURRENCY_LIMIT) {
              const chunk = allRepos.slice(i, i + CONCURRENCY_LIMIT);
              
              const promises = chunk.map(async (repo) => {
                try {
                  const { data: languages } = await github.rest.repos.listLanguages({
                    owner: repo.owner.login,
                    repo: repo.name,
                  });
                  
                  return { success: true, repoName: repo.name, languages };
                } catch (error) {
                  if (error.status === 403 || error.status === 404) {
                    console.log(`Ignorando ${repo.name}: sem acesso ou repositório vazio`);
                  } else {
                    console.log(`Erro em ${repo.name}: ${error.status || 'Erro'} - ${error.message}`);
                  }
                  return { success: false, repoName: repo.name, error };
                }
              });
              
              try {
                const results = await Promise.all(promises);
                
                for (const res of results) {
                  if (res.success) {
                    for (const [lang, bytes] of Object.entries(res.languages)) {
                      allLanguages[lang] = (allLanguages[lang] || 0) + bytes;
                    }
                  }
                }
              } catch (error) {
                console.error(`Erro crítico ao processar chunk: ${error.message}`);
                throw error; // Re-throw para parar o workflow
              }
            }
            
            console.log('Total de linguagens:', allLanguages);
            core.setOutput('languages', JSON.stringify(allLanguages));
