name: Gerar Gráfico de Linguagens (SVG)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar Linguagens de Todos os Repositórios
        id: languages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allLanguages = {};
            let page = 1;
            let hasMore = true;
            let allRepos = [];

            // Buscar todos os repositórios com tratamento de erros
            while (hasMore) {
              try {
                const { data: repos } = await github.rest.repos.listForAuthenticatedUser({
                  per_page: 100,
                  page: page,
                  sort: 'updated'
                });

                if (repos.length === 0) {
                  hasMore = false;
                  break;
                }

                allRepos.push(...repos);
                page++;
              } catch (error) {
                if (error.status === 403) {
                  console.log('⚠️ Acesso negado ao listar repositórios. Verificando permissões do token.');
                  hasMore = false;
                } else if (error.status === 401) {
                  console.error('❌ Token não autorizado. Verifique as credenciais.');
                  throw new Error('Token não autorizado');
                } else {
                  console.error(`❌ Erro ao listar repositórios: ${error.status} - ${error.message}`);
                  throw error;
                }
              }
            }

            console.log(`✅ Total de repositórios encontrados: ${allRepos.length}`);

            if (allRepos.length === 0) {
              console.log('⚠️ Nenhum repositório encontrado. Encerrando.');
              core.setOutput('languages', JSON.stringify({}));
              process.exit(0);
            }

            const CONCURRENCY_LIMIT = 10;

            for (let i = 0; i < allRepos.length; i += CONCURRENCY_LIMIT) {
              const chunk = allRepos.slice(i, i + CONCURRENCY_LIMIT);

              const promises = chunk.map(async (repo) => {
                try {
                  const { data: languages } = await github.rest.repos.listLanguages({
                    owner: repo.owner.login,
                    repo: repo.name,
                  });

                  return { success: true, repoName: repo.name, languages };
                } catch (error) {
                  if (error.status === 403) {
                    console.log(`⚠️ Ignorando ${repo.name}: sem acesso (403)`);
                  } else if (error.status === 404) {
                    console.log(`⚠️ Ignorando ${repo.name}: repositório vazio ou não encontrado (404)`);
                  } else if (error.status === 401) {
                    console.log(`⚠️ Ignorando ${repo.name}: não autorizado (401)`);
                  } else {
                    console.log(`⚠️ Erro em ${repo.name}: ${error.status || 'Erro desconhecido'} - ${error.message}`);
                  }
                  return { success: false, repoName: repo.name, error };
                }
              });

              try {
                const results = await Promise.all(promises);

                for (const res of results) {
                  if (res.success) {
                    for (const [lang, bytes] of Object.entries(res.languages)) {
                      allLanguages[lang] = (allLanguages[lang] || 0) + bytes;
                    }
                  }
                }
              } catch (error) {
                console.error(`❌ Erro crítico ao processar chunk: ${error.message}`);
                throw error;
              }
            }

            console.log('📊 Total de linguagens encontradas:', Object.keys(allLanguages).length);
            console.log('📈 Linguagens:', allLanguages);
            core.setOutput('languages', JSON.stringify(allLanguages));

      - name: Gerar Gráfico SVG com Todos os Idiomas
        run: |
          node << 'EOF'
          const fs = require('fs');
          const languages = JSON.parse('${{ steps.languages.outputs.languages }}');
          
          // Ordenar linguagens por bytes (decrescente)
          const sorted = Object.entries(languages).sort((a, b) => b[1] - a[1]);
          
          // Calcular total
          const total = Object.values(languages).reduce((a, b) => a + b, 0);
          
          if (sorted.length === 0) {
            console.log('⚠️ Nenhuma linguagem encontrada');
            process.exit(0);
          }
          
          // Paleta de cores maior
          const colors = [
            '#f7df1e', '#3776ab', '#f34b7d', '#00add8', '#ce422b',
            '#4479a7', '#563d7c', '#92e1c0', '#f1e05a', '#3178c6',
            '#cc342d', '#00574b', '#ff6b6b', '#4ecdc4', '#ffe66d',
            '#95e1d3', '#c7a3e3', '#a8dadc', '#f1faee', '#e63946'
          ];
          
          // Gerar SVG com gráfico de barras horizontais + legendas
          const chartHeight = Math.max(400, sorted.length * 28 + 120);
          let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="${chartHeight}" viewBox="0 0 800 ${chartHeight}">
            <defs>
              <style>
                .title { font-size: 28px; font-weight: bold; fill: #0d1117; }
                .subtitle { font-size: 12px; fill: #666; }
                .label { font-size: 13px; fill: #0d1117; font-weight: 500; }
                .percent { font-size: 12px; fill: #666; }
                .total { font-size: 11px; fill: #999; }
              </style>
            </defs>
            <rect width="800" height="${chartHeight}" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" rx="8"/>
            
            <!-- Header -->
            <text x="20" y="35" class="title">📊 Meus Idiomas de Programação</text>
            <text x="20" y="55" class="subtitle">Análise de todos os repositórios</text>
          `;
          
          let yOffset = 85;
          let colorIndex = 0;
          
          sorted.forEach(([lang, bytes]) => {
            const percent = ((bytes / total) * 100).toFixed(1);
            const barWidth = Math.max(30, (percent / 100) * 600);
            const color = colors[colorIndex % colors.length];
            
            svg += `
              <!-- ${lang} -->
              <text x="20" y="${yOffset + 12}" class="label">${lang}</text>
              <rect x="150" y="${yOffset}" width="${barWidth}" height="20" fill="${color}" rx="3"/>
              <text x="${Math.min(150 + barWidth + 5, 770)}" y="${yOffset + 14}" class="percent">${percent}%</text>
            `;
            
            yOffset += 28;
            colorIndex++;
          });
          
          // Footer
          const mbTotal = (total / 1024 / 1024).toFixed(1);
          const kbTotal = (total / 1024).toFixed(0);
          svg += `
            <line x1="20" y1="${yOffset}" x2="780" y2="${yOffset}" stroke="#e1e4e8" stroke-width="1"/>
            <text x="20" y="${yOffset + 25}" class="total">📈 Total: ${mbTotal} MB (${kbTotal} KB) | 🗂️ Idiomas: ${sorted.length} | ⏱️ Atualizado: ${new Date().toLocaleDateString('pt-BR')}</text>
          </svg>`;
          
          fs.writeFileSync('languages.svg', svg);
          console.log('✅ SVG gerado com sucesso!');
          console.log(\`📊 Total de linguagens: \${sorted.length}\`);
          console.log(\`📦 Total de bytes: \${total}\`);
          EOF

      - name: Commit e Push com Retry
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add languages.svg
          
          if git diff --staged --quiet; then
            echo "✅ Sem mudanças para commitar"
            exit 0
          fi
          
          git commit -m "📊 Update language statistics SVG"
          
          # Tentar push com retry automático
          for i in {1..3}; do
            echo "🔄 Tentativa $i de 3..."
            if git pull --rebase origin main && git push origin main; then
              echo "✅ Push realizado com sucesso!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "⏳ Aguardando antes de retentar..."
              sleep 2
            fi
          done
          
          echo "❌ Falha após 3 tentativas"
          exit 1
